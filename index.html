/* Visor Agroclimático para Plagas y Enfermedades.
   Paleta: guía gráfica del SENAMHI (style.css, Manual de Imagen Corporativa 2011): azul #0b39b8, amarillo #ffbf00,
   texto #16234a, fondo #eceff9, tarjetas blancas de radio 16 con sombra azul; tipografía Inter.
   Pantalla: solo el mapa con las estaciones. El menú de enfermedades se despliega desde un botón, la leyenda explica cada color
   al pulsarlo y la ficha de la estación se abre al hacer clic en ella. */
:root{
  --azul:#0b39b8; --azul-medio:#3e63d8; --amarillo:#ffbf00; --amarillo-oscuro:#e6a800; --nav-sub:#ffd966;
  --nav:#0b39b8; --nav-ink:#ffffff;
  --bg:#eceff9; --surface:#ffffff; --surface-2:#f3f5fc; --hover:#e2e7f7; --ink:#16234a; --muted:#55608a; --line:#dbe1f3;
  --accent:#0b39b8; --accent-ink:#ffffff; --glass:rgba(255,255,255,.95);
  --sea:#c9d8f0; --sea-label:#6d86b8; --neighbor:#e9ecf3; --neighbor-line:#bfc7d9; --neighbor-label:#8a93ab;
  --land:#ffffff; --dept:#c2cce8; --peru-edge:#0b39b8; --mask:rgba(22,35,74,.55);
  --s0:#7CC47F; --s1:#1f9d55; --s2:#ffbf00; --s3:#ee8a22; --s4:#c0392b; --s5:#6d3b1f; --nodata:#b7bfd3;
  --t:#d2552b; --hr:#3e63d8; --pp:#2f9bd0; --fc:rgba(11,57,184,.05);
  --f-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:var(--f-body); --f-mono:var(--f-body);
  --r-sm:10px; --r-md:12px; --r-lg:16px;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-enter:cubic-bezier(.22,1,.36,1);
  --m-in:150ms; --m-out:120ms; --m-press:90ms; --m-slide:280ms;
  --shadow:0 10px 30px 0 rgba(11,57,184,.12); --shadow-sm:0 2px 8px rgba(11,57,184,.10); --shadow-up:0 14px 34px rgba(11,57,184,.20);
  --btn-shadow:0 10px 24px 0 rgba(230,168,0,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --nav:#0a1f66; --nav-ink:#ffffff;
  --bg:#08112e; --surface:#0f1a3f; --surface-2:#142253; --hover:#1a2a63; --ink:#e7ecfb; --muted:#9eabd6; --line:#233366;
  --accent:#ffbf00; --accent-ink:#16234a; --glass:rgba(15,26,63,.94);
  --sea:#060d26; --sea-label:#4f63a0; --neighbor:#121d44; --neighbor-line:#26366e; --neighbor-label:#5d6c9e;
  --land:#1a2a60; --dept:#33478c; --peru-edge:#ffbf00; --mask:rgba(4,8,24,.6);
  --s0:#6BB86E; --s1:#2fae68; --s2:#ffc61a; --s3:#f08f2e; --s4:#e0473a; --s5:#9a6644; --nodata:#4c5a85;
  --t:#f07a4f; --hr:#86a2ff; --pp:#4db3de; --fc:rgba(255,191,0,.06);
  --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 2px 8px rgba(0,0,0,.4); --shadow-up:0 14px 34px rgba(0,0,0,.55);
  --btn-shadow:0 10px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --nav:#0a1f66; --nav-ink:#ffffff;
  --bg:#08112e; --surface:#0f1a3f; --surface-2:#142253; --hover:#1a2a63; --ink:#e7ecfb; --muted:#9eabd6; --line:#233366;
  --accent:#ffbf00; --accent-ink:#16234a; --glass:rgba(15,26,63,.94);
  --sea:#060d26; --sea-label:#4f63a0; --neighbor:#121d44; --neighbor-line:#26366e; --neighbor-label:#5d6c9e;
  --land:#1a2a60; --dept:#33478c; --peru-edge:#ffbf00; --mask:rgba(4,8,24,.6);
  --s0:#6BB86E; --s1:#2fae68; --s2:#ffc61a; --s3:#f08f2e; --s4:#e0473a; --s5:#9a6644; --nodata:#4c5a85;
  --t:#f07a4f; --hr:#86a2ff; --pp:#4db3de; --fc:rgba(255,191,0,.06);
  --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 2px 8px rgba(0,0,0,.4); --shadow-up:0 14px 34px rgba(0,0,0,.55);
  --btn-shadow:0 10px 24px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amarillo);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;overflow:clip}

/* Franja y barra institucional */
.strip{height:6px;background:var(--amarillo)}
.top{display:flex;align-items:center;gap:20px;background:var(--nav);color:var(--nav-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand>div{min-width:0}
.brand h1{margin:0;font-weight:900;font-size:20px;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance}
.brand small{display:block;font-size:12px;color:var(--nav-sub);font-weight:500}
.runinfo{margin-left:auto;display:flex;gap:22px;font-size:11.5px;color:rgba(255,255,255,.72);flex:none}
.runinfo b{display:block;font-weight:700;color:#fff;font-size:12.5px}

/* Mapa */
.main{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-tooltip{font-family:var(--f-body);font-size:12.5px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm);border-radius:8px;padding:6px 9px}
.leaflet-tooltip-top:before{border-top-color:var(--surface)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow-sm)!important;border-radius:var(--r-sm)!important;overflow:hidden}
.leaflet-bar a,.leaflet-control-layers{background:var(--surface);color:var(--azul);border-color:var(--line)}
:root[data-theme="dark"] .leaflet-bar a{color:var(--ink)}
.leaflet-control-layers{border:1px solid var(--line)!important;box-shadow:var(--shadow-sm)!important;border-radius:var(--r-sm)!important}
.leaflet-control-layers-expanded{padding:8px 12px;font-size:12.5px;color:var(--ink)}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--muted);font-size:10.5px}
.leaflet-control-attribution a{color:var(--azul-medio)}
.lbl{font-size:12px;font-weight:600;color:var(--neighbor-label);white-space:nowrap;letter-spacing:.02em;pointer-events:none;text-shadow:0 0 3px var(--neighbor)}
.lbl.sea{color:var(--sea-label);font-style:italic;font-weight:500;letter-spacing:.12em;text-shadow:none}
.lblw{width:0!important;height:0!important;background:none;border:0}
.lblw .lbl{position:absolute;transform:translate(-50%,-50%)}
.you{width:16px;height:16px;border-radius:50%;background:var(--azul-medio);border:3px solid #fff;box-shadow:0 0 0 6px rgba(62,99,216,.25)}

.fl{position:absolute;z-index:600;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* Menú de enfermedades: botón compacto que se despliega */
.dz{z-index:650;top:14px;left:max(14px,env(safe-area-inset-left,0px));width:300px;max-width:calc(100% - 92px)}
.dzbtn{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:var(--r-lg);cursor:pointer}
.dzbtn .sw{width:12px;height:36px;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;background:var(--line)}
.dzbtn .sw i{display:block;width:100%}
.dzbtn small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.dzbtn b{display:block;font-size:17px;font-weight:800;color:var(--azul);line-height:1.15;letter-spacing:-0.01em}
:root[data-theme="dark"] .dzbtn b{color:var(--ink)}
.dzbtn svg{transition:transform var(--m-slide) var(--ease);color:var(--muted)}
.dz.open .dzbtn svg{transform:rotate(180deg)}
.picker{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--m-slide) var(--ease)}
.dz.open .picker{grid-template-rows:1fr}
.picker>div{overflow:hidden;min-height:0}
.picker .in{padding:2px 8px 8px;border-top:1px solid var(--line);max-height:calc(100vh - 230px);overflow:auto}
.picker h2{margin:10px 6px 6px;font-size:12px;color:var(--muted);font-weight:600}
.pk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r-sm);padding:8px 8px;cursor:pointer}
.pk:hover{background:var(--hover)}
.pk[aria-pressed="true"]{background:var(--azul);color:#fff}
.pk .cu{font-size:11.5px;opacity:.78}
.pk .en{font-weight:700;font-size:15px;line-height:1.15}
.pk .dist{grid-column:1/-1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:4px}
.pk .dist i{display:block;height:100%}
.pk .nalto{grid-row:1/3;grid-column:2;font-size:11px;text-align:right;line-height:1.2;opacity:.85}
.pk .nalto b{display:block;font-size:16px;font-weight:800}

/* Estación más cercana */
.locate{top:14px;right:max(14px,env(safe-area-inset-right,0px));border:0;cursor:pointer;display:flex;align-items:center;gap:8px;
  background:linear-gradient(110deg,var(--amarillo),var(--amarillo-oscuro));color:#0b39b8;font-weight:800;font-size:14px;padding:11px 16px;border-radius:14px;box-shadow:var(--btn-shadow)}
.locate[aria-busy="true"] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.leaflet-top.leaflet-right{top:62px}

/* Leyenda interactiva */
.legend{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:10px;width:272px}
.legend h3{margin:2px 6px 6px;font-size:12px;color:var(--muted);font-weight:600}
.lg{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:6px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.lg:hover{background:var(--hover)}
.lg[aria-expanded="true"]{background:var(--hover);font-weight:700}
.lg i{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.lg span:last-child{font-size:12px;color:var(--muted)}
.lgd{margin:4px 2px 6px 29px;padding:9px 11px;border-left:3px solid var(--c);background:var(--surface);border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.45}
.lgd b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.lgd p{margin:0}
.lghint{margin:6px 6px 2px;font-size:11.5px;color:var(--muted)}

/* Línea de tiempo */
.timeline{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px;display:flex;gap:4px;max-width:calc(100% - 600px);overflow-x:auto}
.tgrp{display:flex;flex-direction:column;gap:4px}
.tgrp>span{font-size:11.5px;color:var(--muted);padding-left:4px;font-weight:600}
.tgrp>div{display:flex;gap:4px}
.tsep{width:1px;background:var(--line);margin:16px 4px 0;flex:none}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:4px 0 6px;width:46px;flex:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.day.fc{border-style:dashed}
.day .wd{font-size:11px;color:var(--muted)}
.day .dn{font-weight:800;font-size:16px;line-height:1.1}
.day .sw{width:26px;height:4px;border-radius:2px;background:var(--nodata)}
.day[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.day[aria-pressed="true"] .wd{color:#fff}

.toast{position:absolute;z-index:700;left:50%;top:72px;transform:translate(-50%,-6px);opacity:0;pointer-events:none;background:var(--texto,#16234a);color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);transition:opacity var(--m-in) var(--ease),transform var(--m-in) var(--ease);max-width:min(440px,calc(100% - 32px));text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Ficha de la estación: panel que se despliega al hacer clic en una estación */
.panel{position:absolute;z-index:1100;top:14px;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;width:min(560px,calc(100% - 28px));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-up);display:flex;flex-direction:column;min-height:0;
  transform:translateX(calc(100% + 40px));visibility:hidden;transition:transform var(--m-slide) var(--ease-enter),visibility 0s linear var(--m-slide)}
.panel.open{transform:none;visibility:visible;transition:transform var(--m-slide) var(--ease-enter),visibility 0s}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px 0 20px}
.phead .eyebrow{flex:1;margin:0;font-size:12px;color:var(--muted);font-weight:600}
.close{border:0;background:var(--hover);color:var(--azul);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
:root[data-theme="dark"] .close{color:var(--ink)}
.pin{overflow-y:auto;min-height:0;padding:4px 20px 20px;display:flex;flex-direction:column;gap:18px}
.pin>*{min-width:0}
.sthead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.sthead h2{margin:0 0 4px;font-size:28px;font-weight:900;color:var(--azul);letter-spacing:-0.02em;line-height:1.1;text-wrap:balance}
:root[data-theme="dark"] .sthead h2{color:var(--ink)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:8px 0 0}
.meta dt{color:var(--muted)} .meta dd{margin:0;color:var(--ink);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.big{text-align:center;min-width:136px}
.big .cap{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px}
.big .lvl{border-radius:var(--r-md);padding:12px 14px;color:#fff;font-weight:800;font-size:17px;line-height:1.15}
.big .lvl.dark{color:#16234a}
.big .val{font-size:12px;color:var(--muted);margin-top:6px}
.others{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.others p{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.oth{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:4px 6px 4px 0;border-radius:6px;cursor:pointer}
.oth:hover{background:var(--hover)}
.oth i{align-self:stretch;border-radius:2px}
.oth b{font-size:14.5px;font-weight:700}
.oth span{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--bg);padding:4px;border-radius:14px}
.tab{flex:1;border:0;background:transparent;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:10px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--azul);box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--ink)}
.tabp{padding-top:14px}
.tabp h3{font-size:17px;font-weight:800;color:var(--azul);margin:0 0 2px;letter-spacing:-0.01em}
:root[data-theme="dark"] .tabp h3{color:var(--ink)}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-body);font-size:10.5px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;z-index:5}
.tip b{font-weight:700}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 8px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{display:inline-block;width:16px;height:3px;border-radius:2px}
.empty{padding:16px 18px;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--muted);font-size:13px;background:var(--surface-2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-weight:700;font-size:12px;color:var(--azul);text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
:root[data-theme="dark"] th{color:var(--muted)}
td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:12.5px}
th:first-child,td:first-child{text-align:left}
tr.fc td{background:var(--fc)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.rec{border-radius:var(--r-md);padding:14px 16px;border:1px solid var(--line);background:var(--surface-2)}
.rec .lv{display:inline-block;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.rec .lv.dark{color:#16234a}
.rec p{margin:0;max-width:65ch}
.reclist{display:flex;flex-direction:column;margin-top:12px;font-size:13px}
.reclist div{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.reclist div.cur{font-weight:600}
.reclist span{font-size:13px;color:var(--muted)}
.reclist p{margin:0}
.draft{font-size:11.5px;color:var(--muted);margin-top:10px}
.mx{border:0}
.mx td{padding:2px;border:0}
.mx td.n{font-size:12.5px;padding-right:10px;white-space:nowrap;cursor:pointer}
.mx td.n small{color:var(--muted);display:block;font-size:10.5px}
.mx tr.sel td.n{color:var(--azul-medio);font-weight:700}
.mx .c{width:22px;height:18px;border-radius:4px}
.mx .c.fc{outline:1.5px dashed var(--surface);outline-offset:-4px}
.mx th{text-align:center;padding:4px 2px;border:0;font-weight:500;font-size:10.5px;color:var(--muted)}
.mx th.h{color:var(--azul-medio);font-weight:800}
.notes{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.notes h4{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--ink)}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:70ch}

/* Hover y press: entra en 150 ms, sale en 120 ms, press 90 ms */
.pk,.day,.oth,.lg,.tab,.dzbtn,.close,.locate,.mx td.n,.leaflet-bar a{transition:background-color var(--m-out) var(--ease),color var(--m-out) var(--ease),transform var(--m-out) var(--ease),box-shadow var(--m-out) var(--ease),border-color var(--m-out) var(--ease)}
.day:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--azul-medio);transition-duration:var(--m-in)}
.locate:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(230,168,0,.45);transition-duration:var(--m-in)}
.dzbtn:hover{background:var(--hover)}
.close:hover{background:var(--line)}
.mx td.n:hover{color:var(--azul-medio)}
.leaflet-bar a:hover{background:var(--hover)}
:is(.pk,.day,.tab,.oth,.lg,.dzbtn,.close,.locate,.leaflet-bar a):active{transform:scale(.97);transition-duration:var(--m-press)}
.day:active{transform:translateY(-2px) scale(.97)}
.chart .guide{position:absolute;top:0;bottom:0;width:1px;background:var(--azul-medio);opacity:.4;pointer-events:none}
@keyframes settle{from{opacity:0;transform:translateY(8px)}}
.app.enter .dz,.app.enter .legend,.app.enter .locate{animation:settle 560ms var(--ease-enter) 100ms both}

@media (max-width: 1180px){ .timeline{max-width:calc(100% - 330px);left:auto;right:14px;transform:none} }
@media (min-width: 761px){ .main.pon .timeline{left:auto;right:calc(min(560px,100% - 28px) + 28px);transform:none;max-width:calc(100% - min(560px,100% - 28px) - 340px)} }
@media (max-width: 760px){
  .runinfo{display:none}
  .brand h1{font-size:16px}
  .brand svg{width:30px;height:30px}
  .dz{width:auto;right:max(14px,env(safe-area-inset-right,0px));max-width:none;top:10px;left:max(10px,env(safe-area-inset-left,0px))}
  .locate{top:auto;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(190px + env(safe-area-inset-bottom,0px));padding:11px 13px}
  .locate span{display:none}
  .leaflet-top.leaflet-right{top:76px}
  .legend{left:10px;right:10px;width:auto;bottom:calc(108px + env(safe-area-inset-bottom,0px));padding:6px}
  .legend h3,.lghint{display:none}
  .legend .rows{display:flex;gap:2px;overflow-x:auto}
  .lg{grid-template-columns:12px auto;white-space:nowrap;width:auto;flex:none;font-size:12px}
  .lg span:last-child{display:none}
  .lg i{width:12px;height:12px}
  .lgd{margin:6px 4px 2px}
  .timeline{left:10px;right:10px;max-width:none;transform:none;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:82%;border-radius:18px 18px 0 0;transform:translateY(calc(100% + 20px));padding-bottom:env(safe-area-inset-bottom,0px)}
  .phead{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .pin{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sthead h2{font-size:23px}
}
@media (max-width: 480px){ .sthead{grid-template-columns:1fr} .big{text-align:left} .reclist div{grid-template-columns:1fr;gap:2px} }
@media (prefers-reduced-motion: reduce){*,*::after{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <div class="strip"></div>
  <header class="top">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="18" fill="#ffbf00"/><path d="M11 26c0-8 6-13.5 16-14.5-1 9-6 14.5-13.5 14.5 3.5-4.5 5.5-6.8 9-9-4.5 1.2-8 4.5-11.5 9z" fill="#0b39b8"/></svg>
      <div><small>SENAMHI · Subdirección de Agrometeorología</small><h1>Visor Agroclimático para Plagas y Enfermedades</h1></div>
    </div>
    <div class="runinfo" id="runinfo"></div>
  </header>
  <main class="main">
    <div id="map" aria-label="Mapa de estaciones"></div>
    <div class="fl dz" id="dz">
      <button class="dzbtn" id="dzbtn" aria-expanded="false" aria-controls="picker"></button>
      <div class="picker" id="picker"><div><div class="in" id="pickin"></div></div></div>
    </div>
    <button class="fl locate" id="locate" type="button" title="Abrir la estación más cercana a tu ubicación">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
      <span>Estación más cercana</span>
    </button>
    <div class="fl legend" id="legend"></div>
    <div class="fl timeline" id="timeline" aria-label="Día"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <aside class="panel" id="panel" aria-label="Ficha de la estación">
      <div class="phead">
        <p class="eyebrow" id="pctx"></p>
        <button class="close" id="pclose" type="button" aria-label="Cerrar la ficha"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="pin">
        <section id="station"></section>
        <div>
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" id="t-riesgo" data-t="riesgo">Riesgo</button>
            <button class="tab" role="tab" id="t-clima" data-t="clima">Clima</button>
            <button class="tab" role="tab" id="t-rec" data-t="rec">Recomendaciones</button>
            <button class="tab" role="tab" id="t-est" data-t="est">Estaciones</button>
          </div>
          <div class="tabp" id="tabp"></div>
        </div>
        <section class="notes" id="notes"></section>
      </div>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const WD = ['dom','lun','mar','mié','jue','vie','sáb'];
const SEVT = ['--s0','--s1','--s2','--s3','--s4','--s5'];
let D, GEO, PAISES, M, STA = {}, dayIdx, hoyIdx, selKey = null, tab = 'riesgo', filt = null;
let map, lyrSt, lyrPaises, lyrHalo, lyrPeru, lyrYou, sat = false;

const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pd = f => { const [y,m,d] = f.split('-').map(Number); return new Date(y, m-1, d); };
const fdm = f => f.slice(8,10) + '/' + f.slice(5,7);
const sevOf = (m, n) => { const i = m.escala.indexOf(n); return i < 0 ? null : m.sev[i]; };
const colOf = (m, n) => { const s = sevOf(m, n); return s == null ? tok('--nodata') : tok(SEVT[s]); };
const darkText = (m, n) => { const s = sevOf(m, n); return s === 2 || s === 0; };
const keyOf = e => e.codigo || ('n:' + e.nombre);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => String(v).replace('.', ',');
const fmtV = (m, v) => v == null ? '—' : num(m.ymax > 1 ? v.toFixed(0) : v.toFixed(2));
const titleCase = s => s ? s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) : '';
const title = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
const dayLbl = i => i === hoyIdx ? 'hoy' : WD[pd(M.fechas[i]).getDay()] + ' ' + fdm(M.fechas[i]);
const narrow = () => innerWidth <= 760;

// departamento por punto en polígono
function depto(lon, lat) {
  if (lon == null || !GEO) return '';
  const inRing = r => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c; } return c; };
  for (const f of GEO.features) {
    const g = f.geometry; if (!g) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    for (const p of polys) if (inRing(p[0]) && !p.slice(1).some(inRing)) return f.properties.nombre;
  }
  return '';
}

async function init() {
  [D, GEO, PAISES] = await Promise.all([
    fetch('datos.json').then(r => r.json()),
    fetch('departamentos.geojson').then(r => r.json()),
    fetch('paises.geojson').then(r => r.ok ? r.json() : null).catch(() => null)]);
  for (const m of D.modelos) for (const e of m.estaciones) {
    const k = keyOf(e);
    STA[k] = STA[k] || { ...e, dep: depto(e.lon, e.lat), modelos: [] };
    STA[k].modelos.push(m.id);
  }
  hoyIdx = D.modelos[0].fechas.indexOf(D.hoy);
  dayIdx = hoyIdx;
  const fc = D.modelos[0].fechas;
  $('#runinfo').innerHTML =
    `<div>Observado · API SENAMHI<b>hasta ${fdm(D.hoy)} 14:00</b></div>` +
    `<div>Pronóstico · ETA 5 km<b>corrida ${D.eta.slice(6,8)}/${D.eta.slice(4,6)} ${D.eta.slice(8)}Z · al ${fdm(fc[fc.length-1])}</b></div>`;
  initMap();
  const app = document.querySelector('.app'); app.classList.add('enter'); setTimeout(() => app.classList.remove('enter'), 1200);
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; renderTab(); });
  $('#dzbtn').onclick = ev => { ev.stopPropagation(); toggleMenu(); };
  document.addEventListener('click', ev => { if (!$('#dz').contains(ev.target)) toggleMenu(false); });
  $('#pclose').onclick = closePanel;
  $('#locate').onclick = locate;
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if ($('#dz').classList.contains('open')) toggleMenu(false);
    else if ($('#panel').classList.contains('open')) closePanel();
    else if (filt) { filt = null; renderLegend(); renderMap(); }
  });
  const h = location.hash.slice(1);
  setModel(D.modelos.some(m => m.id === h) ? h : 'roya', false);
  $('#panel').inert = true;
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== M.id && D.modelos.some(m => m.id === h)) setModel(h, false); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
  new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

function initMap() {
  map = L.map('map', { zoomControl: false, minZoom: 4, maxZoom: 12, zoomSnap: 0.5,
    maxBounds: [[-42, -98], [18, -32]], maxBoundsViscosity: 0.8 });
  fitPeru();
  L.control.zoom({ position: 'topright' }).addTo(map);
  const base = {
    'Mapa': L.layerGroup(),
    'Satélite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri World Imagery', maxZoom: 18 }),
  };
  base['Mapa'].addTo(map);
  map.createPane('base').style.zIndex = 350; map.createPane('labels').style.zIndex = 360;
  map.getPane('labels').style.pointerEvents = 'none';
  if (PAISES) lyrPaises = L.geoJSON(PAISES, { pane: 'base', filter: f => f.properties.iso !== 'PER', interactive: false }).addTo(map);
  lyrHalo = L.geoJSON(GEO, { pane: 'base', interactive: false }).addTo(map);
  lyrPeru = L.geoJSON(GEO, { pane: 'base', interactive: false }).addTo(map);
  [['Océano Pacífico', -11.5, -84.2, 'sea'], ['Ecuador', -1.6, -78.6], ['Colombia', 3.2, -73.6], ['Brasil', -8.6, -64.6],
   ['Bolivia', -16.6, -64.6], ['Chile', -20.6, -69.35]].forEach(([t, la, lo, c]) =>
    L.marker([la, lo], { icon: L.divIcon({ className: 'lblw', html: `<div class="lbl ${c || ''}">${t}</div>`, iconSize: [0, 0] }), pane: 'labels', interactive: false, keyboard: false }).addTo(map));
  styleBase();
  L.control.layers(base, null, { position: 'topright' }).addTo(map);
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  map.attributionControl.addAttribution('Límites: Natural Earth · INEI');
  map.on('baselayerchange', ev => { sat = ev.name === 'Satélite'; styleBase(); });

  } else rango = `${M.modelo.split(' (')[0]}: nivel ${j + 1} de ${M.escala.length}`;

}

// estación más cercana a la ubicación del usuario
function locate() {
  const btn = $('#locate');
  if (!navigator.geolocation) { toast('Este navegador no permite obtener la ubicación.'); return; }
  btn.setAttribute('aria-busy', 'true');
  navigator.geolocation.getCurrentPosition(p => {
    btn.removeAttribute('aria-busy');
    const la = p.coords.latitude, lo = p.coords.longitude, rad = Math.PI / 180;
    const km = e => 6371 * 2 * Math.asin(Math.sqrt(Math.sin((e.lat - la) * rad / 2) ** 2 + Math.cos(la * rad) * Math.cos(e.lat * rad) * Math.sin((e.lon - lo) * rad / 2) ** 2));
    const geo = M.estaciones.filter(e => e.lat != null), con = geo.filter(e => e.niveles[dayIdx] !== 'Sin datos');
    const best = (con.length ? con : geo).map(e => [km(e), e]).sort((a, b) => a[0] - b[0])[0];
    lyrYou.clearLayers();
    L.marker([la, lo], { icon: L.divIcon({ className: 'lblw', html: '<div class="you" style="transform:translate(-50%,-50%)"></div>', iconSize: [0, 0] }), keyboard: false })
      .bindTooltip('Tu ubicación', { direction: 'top', offset: [0, -10] }).addTo(lyrYou);
    if (!best) return;
    const [d, e] = best;
    const pw = narrow() ? 0 : Math.min(560, innerWidth - 28) + 40;
    map.fitBounds([[la, lo], [e.lat, e.lon]], { paddingTopLeft: [60, 100], paddingBottomRight: [pw + 40, narrow() ? innerHeight * .55 : 120], maxZoom: 9 });
    selectStation(keyOf(e));
    toast(`Estación más cercana con datos: ${e.nombre}, a ${d < 10 ? num(d.toFixed(1)) : Math.round(d)} km.`);
  }, err => {
    btn.removeAttribute('aria-busy');
    toast(err.code === 1 ? 'Permite el acceso a tu ubicación en el navegador para buscar la estación más cercana.' : 'No se pudo obtener tu ubicación. Inténtalo de nuevo.');
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
}

const tipAttr = tips => esc(JSON.stringify(tips));

// ---- gráfico de riesgo diario
function tabRiesgo(e) {
  const f = M.fechas, n = f.length, isN = M.graf === 'nivel';
  const W = 640, H = 250, Lm = isN ? 112 : 40, Rm = 10, T = 22, B = 28, cw = (W - Lm - Rm) / n;
  const x = i => Lm + (i + .5) * cw;
  const hasAny = e.niveles.some(l => l !== 'Sin datos');
  let g = `<rect x="${Lm + (hoyIdx + 1) * cw}" y="${T}" width="${W - Rm - Lm - (hoyIdx + 1) * cw}" height="${H - T - B}" fill="${tok('--fc')}"/>`;
  g += `<text x="${W - Rm}" y="${T - 7}" text-anchor="end">Pronóstico ETA 5 km</text>`;
  if (!isN) {
    const y = v => T + (H - T - B) * (1 - Math.min(v, M.ymax) / M.ymax);
    const [u1, u2] = M.umbrales, sv = M.sev;
    [[0, u1, sv[0]], [u1, u2, sv[1]], [u2, M.ymax, sv[2]]].forEach(([a, b, s]) =>
      g += `<rect x="${Lm}" y="${y(b)}" width="${W - Lm - Rm}" height="${y(a) - y(b)}" fill="${tok(SEVT[s])}" fill-opacity=".16"/>`);
    [0, u1, u2, M.ymax].forEach(t => g += `<line x1="${Lm}" x2="${W - Rm}" y1="${y(t)}" y2="${y(t)}" stroke="${tok('--line')}"/><text x="${Lm - 6}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`);
    let so = '', sf = '';
    for (let i = 1; i < n; i++) {
      const a = e.valores[i - 1], b = e.valores[i]; if (a == null || b == null) continue;
      const seg = `M${x(i - 1)},${y(a)}L${x(i)},${y(b)}`;
      if (i <= hoyIdx) so += seg; else sf += seg;
    }
    g += `<path d="${so}" fill="none" stroke="${tok('--ink')}" stroke-width="1.8"/>`;
    g += `<path d="${sf}" fill="none" stroke="${tok('--ink')}" stroke-width="1.8" stroke-dasharray="4 3"/>`;
    e.valores.forEach((v, i) => {
      if (v == null) g += `<text x="${x(i)}" y="${H - B - 4}" text-anchor="middle" style="fill:${tok('--nodata')}">×</text>`;
      else g += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === dayIdx ? 5 : 3.4}" fill="${colOf(M, e.niveles[i])}" stroke="${tok('--surface')}" stroke-width="1.2"/>`;
    });
  } else {
    const k = M.escala.length, y = j => T + (H - T - B) * (1 - j / k);
    M.escala.forEach((l, j) => g += `<line x1="${Lm}" x2="${W - Rm}" y1="${y(j + 1)}" y2="${y(j + 1)}" stroke="${tok('--line')}"/><text x="${Lm - 6}" y="${y(j + 1) + 3.5}" text-anchor="end">${title(l)}</text>`);
    g += `<line x1="${Lm}" x2="${W - Rm}" y1="${y(0)}" y2="${y(0)}" stroke="${tok('--line')}"/>`;
    e.niveles.forEach((l, i) => {
      const j = M.escala.indexOf(l);
      if (j < 0) g += `<text x="${x(i)}" y="${H - B - 4}" text-anchor="middle" style="fill:${tok('--nodata')}">×</text>`;
      else g += `<rect x="${x(i) - cw * .34}" y="${y(j + 1)}" width="${cw * .68}" height="${y(0) - y(j + 1)}" rx="2" fill="${colOf(M, l)}" ${i > hoyIdx ? `fill-opacity=".75" stroke="${tok('--ink')}" stroke-dasharray="3 2" stroke-width=".8"` : ''}/>`;
    });
  }
  g += `<line x1="${x(dayIdx)}" x2="${x(dayIdx)}" y1="${T}" y2="${H - B}" stroke="${tok('--accent')}" stroke-width="1.2" stroke-dasharray="2 2"/>`;
  f.forEach((d, i) => { if ((hoyIdx - i) % 3 === 0) g += `<text x="${x(i)}" y="${H - B + 15}" text-anchor="middle" ${i === hoyIdx ? `style="fill:${tok('--accent')}"` : ''}>${fdm(d)}</text>`; });
  const tips = f.map((d, i) => ({ x: x(i), w: cw, html: `<b>${WD[pd(d).getDay()]} ${fdm(d)}</b><br>${esc(title(e.niveles[i]))}${!isN && e.valores[i] != null ? ' · ' + fmtV(M, e.valores[i]) : ''}<br><span style="color:var(--muted)">${esc(e.tipo[i] || '')}</span>` }));
  const thr = isN ? M.escala.map(title).join(' → ') :
    `${title(M.escala[0])} &lt; ${num(M.umbrales[0])} ≤ ${title(M.escala[1])} &lt; ${num(M.umbrales[1])} ≤ ${title(M.escala[2])}`;
  return `<h3>${M.enfermedad} en ${M.cultivo.toLowerCase()} · <i style="font-weight:500">${M.agente}</i></h3>
    <p class="sub">${M.modelo} · ${M.var} · ${thr}</p>
    ${hasAny ? `<div class="chart" data-tips="${tipAttr(tips)}" data-w="${W}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Serie diaria del índice de ${M.enfermedad}">${g}</svg></div>`
      : `<div class="empty">Esta estación no tiene datos horarios en la API del SENAMHI (${esc(e.fuente)}${e.nota ? ', ' + esc(e.nota) : ''}). Aparecerá cuando su fuente se integre a la corrida.</div>`}`;
}

// ---- meteorología horaria
function tabClima(e) {
  const md = D.meteo[e.codigo];
  if (!md) return `<div class="empty">Sin serie meteorológica horaria para esta estación (${esc(e.fuente)}).</div>`;
  const N = md.T.length, W = 640, Lm = 36, Rm = 38, T = 22, H1 = 190, H2 = 70, gap = 18, B = 26, H = T + H1 + gap + H2 + B;
  const cw = (W - Lm - Rm) / N, x = i => Lm + (i + .5) * cw;
  const tv = md.T.filter(v => v != null), tmin = Math.floor(Math.min(...tv) / 5) * 5, tmax = Math.max(tmin + 5, Math.ceil(Math.max(...tv) / 5) * 5);
  const yT = v => T + H1 * (1 - (v - tmin) / (tmax - tmin)), yH = v => T + H1 * (1 - v / 100);
  const pmax = Math.max(2, ...md.PP.filter(v => v != null)), yP = v => T + H1 + gap + H2 * (1 - v / pmax);
  const f0 = md.src.indexOf('e');
  let g = '';
  if (f0 >= 0) g += `<rect x="${Lm + f0 * cw}" y="${T}" width="${W - Rm - Lm - f0 * cw}" height="${H1 + gap + H2}" fill="${tok('--fc')}"/><text x="${W - Rm}" y="${T - 8}" text-anchor="end">Pronóstico ETA 5 km (ajustado)</text>`;
  for (let t = tmin; t <= tmax; t += 5) g += `<line x1="${Lm}" x2="${W - Rm}" y1="${yT(t)}" y2="${yT(t)}" stroke="${tok('--line')}"/><text x="${Lm - 5}" y="${yT(t) + 3.5}" text-anchor="end" style="fill:${tok('--t')}">${t}°</text>`;
  [0, 50, 100].forEach(h => g += `<text x="${W - Rm + 5}" y="${yH(h) + 3.5}" style="fill:${tok('--hr')}">${h}%</text>`);
  g += `<line x1="${Lm}" x2="${W - Rm}" y1="${yP(0)}" y2="${yP(0)}" stroke="${tok('--line')}"/><text x="${Lm - 5}" y="${yP(pmax) + 8}" text-anchor="end" style="fill:${tok('--pp')}">${pmax.toFixed(0)}</text><text x="${Lm - 5}" y="${yP(0)}" text-anchor="end" style="fill:${tok('--pp')}">0</text><text x="${W - Rm + 5}" y="${yP(pmax / 2) + 3}" style="fill:${tok('--pp')}">mm</text>`;
  const t0 = new Date(md.t0.replace(' ', 'T'));
  const days = [];
  for (let i = 0; i < N; i++) { const d = new Date(t0.getTime() + i * 3600e3); if (d.getHours() === 0) days.push([i, d]); }
  days.forEach(([i, d]) => { g += `<line x1="${Lm + i * cw}" x2="${Lm + i * cw}" y1="${T}" y2="${T + H1 + gap + H2}" stroke="${tok('--line')}" stroke-dasharray="2 3"/><text x="${Lm + (i + 12) * cw}" y="${H - 8}" text-anchor="middle">${WD[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}</text>`; });
  const line = (arr, y) => { let s = '', on = false; arr.forEach((v, i) => { if (v == null || md.src[i] === 'x') { on = false; return; } s += (on ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); on = true; }); return s; };
  md.PP.forEach((v, i) => { if (v > 0) g += `<rect x="${x(i) - cw * .45}" y="${yP(v)}" width="${cw * .9}" height="${yP(0) - yP(v)}" fill="${tok('--pp')}"/>`; });
  g += `<path d="${line(md.HR, yH)}" fill="none" stroke="${tok('--hr')}" stroke-width="1.4"/>`;
  g += `<path d="${line(md.T, yT)}" fill="none" stroke="${tok('--t')}" stroke-width="1.6"/>`;
  const rows = days.map(([i, d], k) => {
    const j = k + 1 < days.length ? days[k + 1][0] : N, sl = a => a.slice(i, j).filter(v => v != null);
    const Ts = sl(md.T), Hs = sl(md.HR), Ps = sl(md.PP), src = md.src.slice(i, j);
    const fte = src.includes('o') && src.includes('e') ? 'Obs + Pron' : src.includes('e') ? 'Pronóstico' : 'Observado';
    return `<tr class="${src.includes('e') ? 'fc' : ''}"><td>${WD[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}</td>
      <td>${Math.min(...Ts).toFixed(1)}</td><td>${Math.max(...Ts).toFixed(1)}</td><td>${(Hs.reduce((a, b) => a + b, 0) / Hs.length).toFixed(0)}</td>
      <td>${Hs.filter(h => h >= 90).length}</td><td>${Ps.reduce((a, b) => a + b, 0).toFixed(1)}</td><td style="font-family:var(--f-body);color:var(--muted);text-align:left">${fte}${src.includes('x') ? ' · con huecos' : ''}</td></tr>`;
  }).join('');
  const tips = [];
  for (let i = 0; i < N; i++) { const d = new Date(t0.getTime() + i * 3600e3); tips.push({ x: x(i), w: cw, html: `<b>${WD[d.getDay()]} ${String(d.getDate()).padStart(2, '0')} · ${String(d.getHours()).padStart(2, '0')}:00</b><br>T <b>${md.T[i] ?? '—'}</b> °C · HR <b>${md.HR[i] ?? '—'}</b> % · PP <b>${md.PP[i] ?? '—'}</b> mm<br><span style="color:var(--muted)">${{ o: 'Observado', e: 'Pronóstico ETA', i: 'Interpolado', x: 'Hueco mayor a 6 h' }[md.src[i]]}</span>` }); }
  return `<h3>Condiciones meteorológicas horarias</h3>
    <p class="sub">${esc(e.nombre)} · 7 días observados y pronóstico. La temperatura y la humedad del ETA están ajustadas con el sesgo medio de la estación.</p>
    <div class="keys"><span><i style="background:${tok('--t')}"></i>Temperatura (°C)</span><span><i style="background:${tok('--hr')}"></i>Humedad relativa (%)</span><span><i style="background:${tok('--pp')};height:8px;width:8px"></i>Precipitación (mm/h)</span></div>
    <div class="chart" data-tips="${tipAttr(tips)}" data-w="${W}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperatura, humedad y precipitación horaria">${g}</svg></div>
    <div class="scroll" style="margin-top:14px"><table><thead><tr><th>Día</th><th>T mín</th><th>T máx</th><th>HR media</th><th>h HR≥90</th><th>PP mm</th><th style="text-align:left">Dato</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function tabRec(e) {
  const R = D.recomendaciones[M.id] || {}, n = e.niveles[dayIdx];
  return `<h3>Recomendaciones · ${M.enfermedad} en ${M.cultivo.toLowerCase()}</h3>
    <p class="sub">${esc(e.nombre)} · ${dayLbl(dayIdx)}</p>
    <div class="rec">${n === 'Sin datos' ? `<p>Sin datos para esta estación y día. Use la estación más cercana con datos o la evaluación de campo.</p>` :
      `<span class="lv${darkText(M, n) ? ' dark' : ''}" style="background:${colOf(M, n)}">${esc(title(n))}</span><p>${esc(R[n] || '')}</p>`}</div>
    <p style="margin:14px 0 0;max-width:65ch"><b>Manejo general.</b> ${esc(R.general || '')}</p>
    <div class="reclist">${M.escala.map(l => `<div class="${l === n ? 'cur' : ''}"><span><b style="color:${colOf(M, l)}">●</b> ${esc(title(l))}</span><p>${esc(R[l] || '')}</p></div>`).join('')}</div>
    <p class="draft">Texto en borrador para validación del especialista de la SPA. No reemplaza la evaluación de campo ni la recomendación del técnico del predio.</p>`;
}

function tabEst() {
  const f = M.fechas, i0 = Math.max(0, hoyIdx - 9), ix = [];
  for (let i = i0; i < f.length; i++) ix.push(i);
  const rows = [...M.estaciones].sort((a, b) => (sevOf(M, b.niveles[dayIdx]) ?? -1) - (sevOf(M, a.niveles[dayIdx]) ?? -1) || a.nombre.localeCompare(b.nombre));
  return `<h3>Todas las estaciones · ${M.enfermedad}</h3>
    <p class="sub">${rows.filter(e => e.niveles[dayIdx] !== 'Sin datos').length} de ${rows.length} estaciones con datos (${dayLbl(dayIdx)}). Ordenadas por el nivel de ese día; el borde punteado marca el pronóstico.</p>
    <div class="scroll"><table class="mx"><thead><tr><th></th>${ix.map(i => `<th class="${i === dayIdx ? 'h' : ''}">${f[i].slice(8)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(e => `<tr class="${keyOf(e) === selKey ? 'sel' : ''}"><td class="n" data-k="${esc(keyOf(e))}">${esc(e.nombre)}${e.fuente !== 'API SENAMHI' ? `<small>${esc(e.fuente)}</small>` : ''}</td>${ix.map(i => `<td><div class="c${i > hoyIdx ? ' fc' : ''}" title="${esc(e.nombre)} · ${fdm(f[i])} · ${esc(title(e.niveles[i]))}" style="background:${colOf(M, e.niveles[i])}"></div></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
}

function renderNotes() {
  $('#notes').innerHTML = `<h4>Cómo se calcula</h4><ul>
    <li>Datos horarios de las estaciones automáticas (API del SENAMHI) hasta las 14:00; desde ahí, el pronóstico horario del modelo ETA 5 km por ${M.fechas.length - hoyIdx - 1} días.</li>
    <li>La temperatura y la humedad del ETA se ajustan en cada estación con el desvío medio frente a lo observado en las horas comunes. Es un ajuste provisional.</li>
    <li>La unidad de la precipitación del ETA aún no está confirmada. Se usa como mm y por ahora casi no aporta lluvia al pronóstico.</li>
    <li>Sin datos: estación fuera de la API (red Polaris de la SPA, SISDAD o solo convencional diaria), día con huecos de más de 6 horas o estación sin transmitir en las últimas 48 horas.</li>
    <li>Los modelos se ejecutan tal como están en los scripts de la SPA, con las escalas de cada modelo.</li></ul>`;
}

function attachTip(box) {
  const tips = JSON.parse(box.dataset.tips || '[]'), W = +box.dataset.w; if (!tips.length) return;
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; box.appendChild(tip);
  const gd = document.createElement('div'); gd.className = 'guide'; gd.hidden = true; box.appendChild(gd);
  box.onmousemove = ev => {
    const r = box.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    const t = tips.find(t => Math.abs(t.x - sx) <= t.w / 2); if (!t) { tip.hidden = gd.hidden = true; return; }
    tip.innerHTML = t.html; tip.hidden = false;
    const px = t.x * r.width / W; gd.hidden = false; gd.style.left = px + 'px';
    tip.style.left = (px > r.width * .6 ? px - tip.offsetWidth - 12 : px + 12) + 'px';
    tip.style.top = Math.max(0, ev.clientY - r.top - tip.offsetHeight - 10) + 'px';
  };
  box.onmouseleave = () => { tip.hidden = gd.hidden = true; };
}


init().catch(err => { console.error(err); toast('No se pudieron cargar los datos del visor (' + err.message + '). Verifique que datos.json, departamentos.geojson y paises.geojson estén junto a esta página.'); });
</script>
