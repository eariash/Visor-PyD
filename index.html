/* Layout: mapa a pantalla completa con controles flotantes (enfermedad, días, leyenda) y panel de estación a la derecha
   (ficha + pestañas Riesgo / Clima / Recomendaciones / Estaciones); en móvil se apilan.
   Sistema (tasteskill): paleta "teal-on-paper", tipografía Host Grotesk + JetBrains Mono, radio "soft", capa de hover/press. */
:root{
  --bg:#EBF0EE; --surface:#F7F9F8; --surface-2:#EBF0EE; --ink:#06525C; --muted:#2F737D; --line:#D2DEDB;
  --accent:#06525C; --accent-ink:#F7F9F8; --sea:#DCE6E3; --land:#F7F9F8; --dept:#9AB6B2; --glass:rgba(247,249,248,.93);
  --s0:#7CC47F; --s1:#2E9E5B; --s2:#E2B30B; --s3:#EE8A22; --s4:#D33A2C; --s5:#7A4A2B; --nodata:#B3C2BF;
  --t:#D2552B; --hr:#2477B3; --pp:#3C9CC9; --fc:rgba(6,82,92,.06);
  --f-display:"Host Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Host Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --display-weight:500; --display-tracking:-0.035em;
  --r-sm:8px; --r-md:12px; --r-lg:20px;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-enter:cubic-bezier(.22,1,.36,1);
  --m-in:150ms; --m-out:120ms; --m-press:90ms; --m-slide:240ms;
  --shadow:0 1px 2px rgba(6,82,92,.08),0 8px 24px rgba(6,82,92,.10);
  --shadow-up:0 2px 4px rgba(6,82,92,.10),0 12px 28px rgba(6,82,92,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#051214; --surface:#0A1C1F; --surface-2:#0F262A; --ink:#E2EEEC; --muted:#8DB0AF; --line:#1C383C;
  --accent:#7CCACD; --accent-ink:#04262A; --sea:#030D0F; --land:#0E2326; --dept:#2D5156; --glass:rgba(10,28,31,.9);
  --s0:#6BB86E; --s1:#2F9F5D; --s2:#D9AC12; --s3:#E8862A; --s4:#E0473A; --s5:#9A6644; --nodata:#4A6164;
  --t:#F07A4F; --hr:#5AA7E0; --pp:#4DB3DE; --fc:rgba(124,202,205,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); --shadow-up:0 2px 4px rgba(0,0,0,.45),0 12px 28px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#051214; --surface:#0A1C1F; --surface-2:#0F262A; --ink:#E2EEEC; --muted:#8DB0AF; --line:#1C383C;
  --accent:#7CCACD; --accent-ink:#04262A; --sea:#030D0F; --land:#0E2326; --dept:#2D5156; --glass:rgba(10,28,31,.9);
  --s0:#6BB86E; --s1:#2F9F5D; --s2:#D9AC12; --s3:#E8862A; --s4:#E0473A; --s5:#9A6644; --nodata:#4A6164;
  --t:#F07A4F; --hr:#5AA7E0; --pp:#4DB3DE; --fc:rgba(124,202,205,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); --shadow-up:0 2px 4px rgba(0,0,0,.45),0 12px 28px rgba(0,0,0,.55); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;overflow-x:clip}
.brand>div,.main>*{min-width:0}
.brand h1{text-wrap:balance}

.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:var(--display-weight);font-size:21px;letter-spacing:var(--display-tracking);line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted)}
.runinfo{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.runinfo b{display:block;font-family:var(--f-mono);font-weight:500;color:var(--ink);font-size:12.5px}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,560px);min-height:0}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-tooltip{font-family:var(--f-body);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.leaflet-tooltip-top:before{border-top-color:var(--surface)}
.leaflet-bar a,.leaflet-control-layers{background:var(--surface);color:var(--ink);border-color:var(--line)}
.leaflet-control-layers-expanded{padding:8px 10px;font-size:12px}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--accent)}

.fl{position:absolute;z-index:500;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow)}
.picker{top:12px;left:12px;width:262px;padding:8px;max-height:calc(100% - 140px);overflow:auto}
.picker h2{margin:4px 8px 8px;font-size:12px;color:var(--muted);font-weight:500}
.pk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r-sm);padding:7px 8px;cursor:pointer}
.pk:hover{background:var(--surface-2)}
.pk[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pk .cu{font-size:11.5px;opacity:.8}
.pk .en{font-family:var(--f-display);font-weight:var(--display-weight);font-size:16px;letter-spacing:-0.015em;line-height:1.1}
.pk .dist{grid-column:1/-1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:3px}
.pk .dist i{display:block;height:100%}
.pk .nalto{grid-row:1/3;grid-column:2;font-family:var(--f-mono);font-size:11px;text-align:right;line-height:1.2}
.pk .nalto b{display:block;font-size:15px;font-weight:500}

.timeline{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px;display:flex;gap:4px;max-width:calc(100% - 24px);overflow-x:auto}
.tgrp{display:flex;flex-direction:column;gap:4px}
.tgrp>span{font-size:11.5px;color:var(--muted);padding-left:4px;font-weight:500}
.tgrp>div{display:flex;gap:4px}
.tsep{width:1px;background:var(--line);margin:14px 4px 0;flex:none}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:4px 0 5px;width:48px;flex:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.day.fc{border-style:dashed}
.day .wd{font-size:11px;color:var(--muted)}
.day .dn{font-family:var(--f-mono);font-weight:500;font-size:16px;line-height:1.1}
.day .sw{width:28px;height:4px;border-radius:2px;background:var(--nodata)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .wd{color:var(--accent-ink)}

.legend{left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:9px 11px;font-size:12px;max-width:230px}
.legend h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500}
.legend div{display:flex;align-items:center;gap:7px;line-height:1.7}
.legend i{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid var(--surface)}

.panel{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;min-height:0;min-width:0}
.pin{padding-block:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500;margin:0}
.sthead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.sthead h2{margin:2px 0 4px;font-family:var(--f-display);font-size:32px;font-weight:var(--display-weight);letter-spacing:var(--display-tracking);line-height:1.05;text-wrap:balance}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;margin:8px 0 0}
.meta dt{color:var(--muted)} .meta dd{margin:0;color:var(--ink);font-family:var(--f-mono);font-size:12px;min-width:0;overflow-wrap:anywhere}
.big{text-align:center;min-width:132px}
.big .lvl{border-radius:var(--r-md);padding:11px 14px;color:#fff;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.1;letter-spacing:-0.01em}
.big .lvl.dark{color:#1B1B1B}
.big .val{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}
.others{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.oth{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:3px 0;cursor:pointer}
.oth i{align-self:stretch;border-radius:2px}
.oth b{font-family:var(--f-display);font-size:15.5px;font-weight:var(--display-weight);background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size var(--m-out) var(--ease)}
.oth span{font-size:12px;color:var(--muted)}
.oth:hover b{background-size:100% 1px;transition-duration:var(--m-in)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{position:relative;border:0;background:transparent;padding:10px 12px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:var(--r-sm) var(--r-sm) 0 0}
.tab::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform var(--m-slide) var(--ease)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tabp{padding-top:14px}
.tabp h3{font-family:var(--f-display);font-size:19px;font-weight:var(--display-weight);letter-spacing:-0.02em;margin:0 0 2px}
.sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r-sm);padding:6px 9px;font-size:12px;white-space:nowrap;z-index:5}
.tip b{font-family:var(--f-mono);font-weight:500}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 8px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{display:inline-block;width:16px;height:3px;border-radius:2px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--muted);font-size:13px}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px}
th:first-child,td:first-child{text-align:left}
tr.fc td{background:var(--fc)}
.scroll{overflow-x:auto}

.rec{border-radius:var(--r-md);padding:14px 16px;border:1px solid var(--line);background:var(--surface-2)}
.rec .lv{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:14px;padding:2px 8px;border-radius:6px;color:#fff;margin-bottom:6px}
.rec .lv.dark{color:#1B1B1B}
.rec p{margin:0;max-width:65ch}
.reclist{display:flex;flex-direction:column;margin-top:12px;font-size:13px}
.reclist div{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.reclist div.cur{font-weight:600}
.reclist span{font-size:13px;color:var(--muted)}
.reclist p{margin:0}
.draft{font-size:11.5px;color:var(--muted);margin-top:10px}

.mx td{padding:2px;border:0}
.mx td.n{font-family:var(--f-body);font-size:12.5px;padding-right:10px;white-space:nowrap;cursor:pointer}
.mx td.n small{color:var(--muted);display:block;font-size:10.5px}
.mx tr.sel td.n{color:var(--accent);font-weight:600}
.mx .c{width:22px;height:18px;border-radius:3px}
.mx .c.fc{outline:1.5px dashed var(--surface);outline-offset:-4px}
.mx th{text-align:center;padding:2px;border:0;font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:0}
.mx th.h{color:var(--accent);font-weight:600}

.notes{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.notes h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink)}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:70ch}


/* Capa de hover y press (tasteskill motion.md): entra en 150 ms, sale en 120 ms, press 90 ms; sin rebote. */
.pk,.day,.oth,.mx td.n,.leaflet-bar a,.leaflet-control-layers-toggle{transition:background-color var(--m-out) var(--ease),color var(--m-out) var(--ease),transform var(--m-out) var(--ease),box-shadow var(--m-out) var(--ease),border-color var(--m-out) var(--ease)}
.day:hover{transform:translateY(-2px);box-shadow:var(--shadow-up);border-color:var(--accent);transition-duration:var(--m-in)}
.pk:hover,.mx td.n:hover{transition-duration:var(--m-in)}
.mx td.n:hover{color:var(--accent)}
.leaflet-bar a:hover{background:var(--surface-2);color:var(--accent)}
:is(.pk,.day,.tab,.oth,.leaflet-bar a):active{transform:scale(.97);transition-duration:var(--m-press)}
.chart .guide{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:.35;pointer-events:none}
/* Entrada única al cargar */
@keyframes settle{from{opacity:0;transform:translateY(8px)}}
.app.enter .top{animation:settle 520ms var(--ease-enter) both}
.app.enter .fl{animation:settle 600ms var(--ease-enter) 120ms both}
.app.enter .pin>*{animation:settle 600ms var(--ease-enter) both}
.app.enter .pin>*:nth-child(2){animation-delay:90ms}
.app.enter .pin>*:nth-child(3){animation-delay:180ms}
.timeline.fl{animation-name:none}

@media (max-width: 900px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .mapwrap{height:64vh;min-height:420px}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .picker{left:8px;right:8px;top:8px;width:auto;max-height:none;display:flex;gap:4px;overflow-x:auto;padding:6px}
  .picker h2{display:none}
  .pk{width:auto;flex:none;padding:6px 10px}
  .pk .nalto{display:none}
  .legend{display:none}
  .timeline{bottom:8px}
  .runinfo{margin-left:0}
  .leaflet-top.leaflet-right{top:64px}
}
@media (max-width: 480px){ .sthead{grid-template-columns:1fr} .big{text-align:left} .reclist div{grid-template-columns:1fr;gap:2px} }
@media (prefers-reduced-motion: reduce){*,*::after{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--accent)"/><path d="M10 23c0-7 5-12 14-13-1 8-5 13-12 13 3-4 5-6 8-8-4 1-7 4-10 8z" fill="var(--accent-ink)"/></svg>
      <div><small>SENAMHI · Subdirección de Predicción Agrometeorológica</small><h1>Riesgo agroclimático de enfermedades</h1></div>
    </div>
    <div class="runinfo" id="runinfo"></div>
  </header>
  <div class="main">
    <section class="mapwrap" aria-label="Mapa de estaciones">
      <div id="map"></div>
      <nav class="fl picker" id="picker" aria-label="Cultivo y enfermedad"></nav>
      <div class="fl legend" id="legend"></div>
      <div class="fl timeline" id="timeline" aria-label="Día"></div>
    </section>
    <aside class="panel" id="panel">
      <div class="pin">
        <section id="station"></section>
        <div>
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" id="t-riesgo" data-t="riesgo">Riesgo</button>
            <button class="tab" role="tab" id="t-clima" data-t="clima">Clima</button>
            <button class="tab" role="tab" id="t-rec" data-t="rec">Recomendaciones</button>
            <button class="tab" role="tab" id="t-est" data-t="est">Estaciones</button>
          </div>
          <div class="tabp" id="tabp"></div>
        </div>
        <section class="notes" id="notes"></section>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const WD = ['dom','lun','mar','mié','jue','vie','sáb'];
const SEVT = ['--s0','--s1','--s2','--s3','--s4','--s5'];
let D, GEO, M, STA = {}, dayIdx, hoyIdx, selKey = null, tab = 'riesgo';
let map, lyrSt, lyrDept, tilesOk = false;

const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pd = f => { const [y,m,d] = f.split('-').map(Number); return new Date(y, m-1, d); };
const fdm = f => f.slice(8,10) + '/' + f.slice(5,7);
const sevOf = (m, n) => { const i = m.escala.indexOf(n); return i < 0 ? null : m.sev[i]; };
const colOf = (m, n) => { const s = sevOf(m, n); return s == null ? tok('--nodata') : tok(SEVT[s]); };
const darkText = (m, n) => { const s = sevOf(m, n); return s === 2 || s === 0; };
const keyOf = e => e.codigo || ('n:' + e.nombre);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtV = (m, v) => v == null ? '—' : (m.ymax > 1 ? v.toFixed(0) : v.toFixed(2));
const titleCase = s => s ? s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) : '';
const title = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
const dayLbl = i => i === hoyIdx ? 'hoy' : WD[pd(M.fechas[i]).getDay()] + ' ' + fdm(M.fechas[i]);

// departamento por punto en polígono
function depto(lon, lat) {
  if (lon == null || !GEO) return '';
  const inRing = r => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c; } return c; };
  for (const f of GEO.features) {
    const g = f.geometry; if (!g) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    for (const p of polys) if (inRing(p[0]) && !p.slice(1).some(inRing)) return f.properties.nombre;
  }
  return '';
}

async function init() {
  [D, GEO] = await Promise.all([fetch('datos.json').then(r => r.json()), fetch('departamentos.geojson').then(r => r.json())]);
  for (const m of D.modelos) for (const e of m.estaciones) {
    const k = keyOf(e);
    STA[k] = STA[k] || { ...e, dep: depto(e.lon, e.lat), modelos: [] };
    STA[k].modelos.push(m.id);
  }
  hoyIdx = D.modelos[0].fechas.indexOf(D.hoy);
  dayIdx = hoyIdx;
  const fc = D.modelos[0].fechas;
  $('#runinfo').innerHTML =
    `<div>Observado · API SENAMHI<b>hasta ${fdm(D.hoy)} 14:00</b></div>` +
    `<div>Pronóstico · ETA 5 km<b>corrida ${D.eta.slice(6,8)}/${D.eta.slice(4,6)} ${D.eta.slice(8)}Z · al ${fdm(fc[fc.length-1])}</b></div>`;
  initMap();
  const app = document.querySelector('.app'); app.classList.add('enter'); setTimeout(() => app.classList.remove('enter'), 1200);
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; renderTab(); });
  const h = location.hash.slice(1);
  setModel(D.modelos.some(m => m.id === h) ? h : 'roya', false);
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== M.id && D.modelos.some(m => m.id === h)) setModel(h, false); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
  new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

function initMap() {
  map = L.map('map', { zoomControl: false, minZoom: 4, zoomSnap: 0.25 });
  map.fitBounds([[-18.4, -81.4], [-0.03, -68.6]], { paddingTopLeft: [innerWidth > 900 ? 260 : 0, innerWidth > 900 ? 0 : 60], paddingBottomRight: [0, 70] });
  L.control.zoom({ position: 'topright' }).addTo(map);
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const base = {
    'Mapa': L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${dark ? 'World_Dark_Gray_Base' : 'World_Light_Gray_Base'}/MapServer/tile/{z}/{y}/{x}`, { attribution: 'Esri, HERE, Garmin, © OpenStreetMap', maxZoom: 16 }),
    'Satélite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri World Imagery', maxZoom: 18 }),
  };
  for (const l of Object.values(base)) l.on('tileload', () => { if (!tilesOk) { tilesOk = true; styleDept(); } });
  base['Mapa'].addTo(map);
  lyrDept = L.geoJSON(GEO, { interactive: false }).addTo(map);
  styleDept();
  L.control.layers(base, { 'Departamentos': lyrDept }, { position: 'topright' }).addTo(map);
  lyrSt = L.layerGroup().addTo(map);
}
function styleDept() {
  lyrDept.setStyle({ color: tok('--dept'), weight: 1, fillColor: tok('--land'), fillOpacity: tilesOk ? 0 : 1 });
}

function setModel(id, push = true) {
  M = D.modelos.find(m => m.id === id);
  if (push) history.replaceState(null, '', '#' + id);
  if (!selKey || !M.estaciones.some(e => keyOf(e) === selKey)) {
    const best = [...M.estaciones].sort((a, b) => (sevOf(M, b.niveles[dayIdx]) ?? -1) - (sevOf(M, a.niveles[dayIdx]) ?? -1))[0];
    selKey = keyOf(best);
  }
  renderAll();
}
const selE = () => M.estaciones.find(e => keyOf(e) === selKey);
function selectStation(k) { selKey = k; renderMap(); renderStation(); renderTab(); }

function renderAll() { if (!M) return; styleDept(); renderPicker(); renderTimeline(); renderLegend(); renderMap(); renderStation(); renderTab(); renderNotes(); }

function dist(m, i) {
  const c = {}; let n = 0;
  for (const e of m.estaciones) { const s = sevOf(m, e.niveles[i]); if (s != null) { c[s] = (c[s] || 0) + 1; n++; } }
  return { c, n };
}
function renderPicker() {
  $('#picker').innerHTML = '<h2>Cultivo · enfermedad · ' + dayLbl(dayIdx) + '</h2>' + D.modelos.map(m => {
    const { c, n } = dist(m, dayIdx);
    const top = Math.max(...m.sev.filter(s => s < 5));
    const bars = Object.keys(c).sort().map(s => `<i style="width:${100 * c[s] / n}%;background:${tok(SEVT[s])}"></i>`).join('');
    return `<button class="pk" aria-pressed="${m.id === M.id}" data-m="${m.id}" title="Estaciones en el nivel más alto">
      <span class="cu">${m.cultivo}</span><span class="nalto"><b>${c[top] || 0}</b>alto</span>
      <span class="en">${m.enfermedad}</span><span class="dist">${bars}</span></button>`;
  }).join('');
  $('#picker').querySelectorAll('.pk').forEach(b => b.onclick = () => setModel(b.dataset.m));
}
function renderTimeline() {
  const f = M.fechas, mk = i => {
    const { c } = dist(M, i); const top = Object.keys(c).map(Number).filter(s => s < 5).sort((a, b) => b - a)[0];
    return `<button class="day${i > hoyIdx ? ' fc' : ''}" aria-pressed="${i === dayIdx}" data-i="${i}" title="${f[i]} · nivel más alto entre las estaciones">
      <span class="wd">${i === hoyIdx ? 'hoy' : WD[pd(f[i]).getDay()]}</span><span class="dn">${f[i].slice(8)}</span>
      <span class="sw" style="background:${top == null ? tok('--nodata') : tok(SEVT[top])}"></span></button>`;
  };
  const obs = [], fc = [];
  for (let i = Math.max(0, hoyIdx - 6); i <= hoyIdx; i++) obs.push(mk(i));
  for (let i = hoyIdx + 1; i < f.length; i++) fc.push(mk(i));
  $('#timeline').innerHTML = `<div class="tgrp"><span>Observado</span><div>${obs.join('')}</div></div><div class="tsep"></div>
    <div class="tgrp"><span>Pronóstico ETA</span><div>${fc.join('')}</div></div>`;
  $('#timeline').querySelectorAll('.day').forEach(b => b.onclick = () => { dayIdx = +b.dataset.i; renderAll(); });
}
function renderLegend() {
  $('#legend').innerHTML = `<h3>${M.enfermedad} · ${dayLbl(dayIdx)}</h3>` +
    M.escala.map(n => `<div><i style="background:${colOf(M, n)}"></i>${title(n)}</div>`).join('') +
    `<div><i style="background:${tok('--nodata')}"></i>Sin datos</div>`;
}
function renderMap() {
  lyrSt.clearLayers();
  const surf = tok('--surface'), acc = tok('--accent');
  const list = M.estaciones.filter(e => e.lat != null)
    .sort((a, b) => (sevOf(M, a.niveles[dayIdx]) ?? -1) - (sevOf(M, b.niveles[dayIdx]) ?? -1));
  for (const e of list) {
    const n = e.niveles[dayIdx], s = sevOf(M, n), sel = keyOf(e) === selKey;
    if (sel) L.circleMarker([e.lat, e.lon], { radius: 17, color: acc, weight: 2.5, fill: false, interactive: false }).addTo(lyrSt);
    const c = L.circleMarker([e.lat, e.lon], { radius: s == null ? 6 : (sel ? 11 : 9), color: surf, weight: 2,
      fillColor: colOf(M, n), fillOpacity: 1, dashArray: s == null ? '2 2' : null }).addTo(lyrSt);
    c.bindTooltip(`<b>${esc(e.nombre)}</b><br>${esc(title(n))}${e.valores[dayIdx] != null && M.graf !== 'nivel' ? ' · ' + fmtV(M, e.valores[dayIdx]) : ''}`, { direction: 'top', offset: [0, -8] });
    const r0 = c.options.radius;
    c.on('mouseover', () => c.setRadius(r0 + 2)); c.on('mouseout', () => c.setRadius(r0));
    c.on('click', () => selectStation(keyOf(e)));
  }
}

function renderStation() {
  const e = selE(), S = STA[selKey];
  if (!e) { $('#station').innerHTML = ''; return; }
  const n = e.niveles[dayIdx], v = e.valores[dayIdx], t = e.tipo[dayIdx];
  const others = S.modelos.filter(id => id !== M.id).map(id => {
    const m = D.modelos.find(x => x.id === id), x = m.estaciones.find(z => keyOf(z) === selKey), nn = x.niveles[dayIdx];
    return `<button class="oth" data-m="${id}"><i style="background:${colOf(m, nn)}"></i><span><b>${m.enfermedad}</b> · ${m.cultivo}</span><span>${esc(title(nn))}</span></button>`;
  }).join('');
  $('#station').innerHTML = `
    <div class="sthead">
      <div style="min-width:0">
        <p class="eyebrow">Estación</p>
        <h2>${esc(e.nombre)}</h2>
        <dl class="meta">
          ${S.dep ? `<dt>Región</dt><dd>${esc(titleCase(S.dep))}</dd>` : ''}
          ${e.lat != null ? `<dt>Ubicación</dt><dd>${e.lat.toFixed(3)}, ${e.lon.toFixed(3)} · ${e.alt ?? '—'} m</dd>` : ''}
          ${e.codigo ? `<dt>Código</dt><dd>${esc(e.codigo)}${e.nombre_api && e.nombre_api.toLowerCase() !== e.nombre.toLowerCase() ? ' · ' + esc(e.nombre_api) : ''}</dd>` : ''}
          <dt>Fuente</dt><dd>${esc(e.fuente)}${e.nota ? ' · ' + esc(e.nota) : ''}</dd>
          ${e.sesgo ? `<dt>Ajuste ETA</dt><dd>T ${e.sesgo.dT >= 0 ? '+' : ''}${e.sesgo.dT} °C · HR ${e.sesgo.dHR >= 0 ? '+' : ''}${e.sesgo.dHR} % (${e.sesgo.n} h)</dd>` : ''}
        </dl>
      </div>
      <div class="big">
        <p class="eyebrow" style="margin-bottom:6px">${M.enfermedad} · ${dayLbl(dayIdx)}</p>
        <div class="lvl${darkText(M, n) ? ' dark' : ''}" style="background:${colOf(M, n)}">${esc(title(n))}</div>
        <div class="val">${M.graf !== 'nivel' && v != null ? M.var.split(' (')[0] + ' ' + fmtV(M, v) + '<br>' : ''}${t || ''}</div>
      </div>
    </div>
    ${others ? `<div class="others" style="margin-top:14px"><p class="eyebrow">Otras enfermedades en esta estación</p>${others}</div>` : ''}`;
  $('#station').querySelectorAll('.oth').forEach(b => b.onclick = () => setModel(b.dataset.m));
}

function renderTab() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
  const e = selE(), p = $('#tabp');
  if (!e) { p.innerHTML = ''; return; }
  p.innerHTML = tab === 'riesgo' ? tabRiesgo(e) : tab === 'clima' ? tabClima(e) : tab === 'rec' ? tabRec(e) : tabEst();
  p.querySelectorAll('[data-k]').forEach(r => r.onclick = () => selectStation(r.dataset.k));
  p.querySelectorAll('.chart').forEach(attachTip);
}
const tipAttr = tips => esc(JSON.stringify(tips));

// ---- gráfico de riesgo diario
function tabRiesgo(e) {
  const f = M.fechas, n = f.length, isN = M.graf === 'nivel';
  const W = 640, H = 250, Lm = isN ? 112 : 40, Rm = 10, T = 22, B = 28, cw = (W - Lm - Rm) / n;
  const x = i => Lm + (i + .5) * cw;
  const hasAny = e.niveles.some(l => l !== 'Sin datos');
  let g = `<rect x="${Lm + (hoyIdx + 1) * cw}" y="${T}" width="${W - Rm - Lm - (hoyIdx + 1) * cw}" height="${H - T - B}" fill="${tok('--fc')}"/>`;
  g += `<text x="${W - Rm}" y="${T - 7}" text-anchor="end">Pronóstico ETA 5 km</text>`;
  if (!isN) {
    const y = v => T + (H - T - B) * (1 - Math.min(v, M.ymax) / M.ymax);
    const [u1, u2] = M.umbrales, sv = M.sev;
    [[0, u1, sv[0]], [u1, u2, sv[1]], [u2, M.ymax, sv[2]]].forEach(([a, b, s]) =>
      g += `<rect x="${Lm}" y="${y(b)}" width="${W - Lm - Rm}" height="${y(a) - y(b)}" fill="${tok(SEVT[s])}" fill-opacity=".16"/>`);
    [0, u1, u2, M.ymax].forEach(t => g += `<line x1="${Lm}" x2="${W - Rm}" y1="${y(t)}" y2="${y(t)}" stroke="${tok('--line')}"/><text x="${Lm - 6}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`);
    let so = '', sf = '';
    for (let i = 1; i < n; i++) {
      const a = e.valores[i - 1], b = e.valores[i]; if (a == null || b == null) continue;
      const seg = `M${x(i - 1)},${y(a)}L${x(i)},${y(b)}`;
      if (i <= hoyIdx) so += seg; else sf += seg;
    }
    g += `<path d="${so}" fill="none" stroke="${tok('--ink')}" stroke-width="1.8"/>`;
    g += `<path d="${sf}" fill="none" stroke="${tok('--ink')}" stroke-width="1.8" stroke-dasharray="4 3"/>`;
    e.valores.forEach((v, i) => {
      if (v == null) g += `<text x="${x(i)}" y="${H - B - 4}" text-anchor="middle" style="fill:${tok('--nodata')}">×</text>`;
      else g += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === dayIdx ? 5 : 3.4}" fill="${colOf(M, e.niveles[i])}" stroke="${tok('--surface')}" stroke-width="1.2"/>`;
    });
  } else {
    const k = M.escala.length, y = j => T + (H - T - B) * (1 - j / k);
    M.escala.forEach((l, j) => g += `<line x1="${Lm}" x2="${W - Rm}" y1="${y(j + 1)}" y2="${y(j + 1)}" stroke="${tok('--line')}"/><text x="${Lm - 6}" y="${y(j + 1) + 3.5}" text-anchor="end">${title(l)}</text>`);
    g += `<line x1="${Lm}" x2="${W - Rm}" y1="${y(0)}" y2="${y(0)}" stroke="${tok('--line')}"/>`;
    e.niveles.forEach((l, i) => {
      const j = M.escala.indexOf(l);
      if (j < 0) g += `<text x="${x(i)}" y="${H - B - 4}" text-anchor="middle" style="fill:${tok('--nodata')}">×</text>`;
      else g += `<rect x="${x(i) - cw * .34}" y="${y(j + 1)}" width="${cw * .68}" height="${y(0) - y(j + 1)}" rx="2" fill="${colOf(M, l)}" ${i > hoyIdx ? `fill-opacity=".75" stroke="${tok('--ink')}" stroke-dasharray="3 2" stroke-width=".8"` : ''}/>`;
    });
  }
  g += `<line x1="${x(dayIdx)}" x2="${x(dayIdx)}" y1="${T}" y2="${H - B}" stroke="${tok('--accent')}" stroke-width="1.2" stroke-dasharray="2 2"/>`;
  f.forEach((d, i) => { if ((hoyIdx - i) % 3 === 0) g += `<text x="${x(i)}" y="${H - B + 15}" text-anchor="middle" ${i === hoyIdx ? `style="fill:${tok('--accent')}"` : ''}>${fdm(d)}</text>`; });
  const tips = f.map((d, i) => ({ x: x(i), w: cw, html: `<b>${WD[pd(d).getDay()]} ${fdm(d)}</b><br>${esc(title(e.niveles[i]))}${!isN && e.valores[i] != null ? ' · ' + fmtV(M, e.valores[i]) : ''}<br><span style="color:var(--muted)">${esc(e.tipo[i] || '')}</span>` }));
  const thr = isN ? M.escala.map(title).join(' → ') :
    `${title(M.escala[0])} &lt; ${M.umbrales[0]} ≤ ${title(M.escala[1])} &lt; ${M.umbrales[1]} ≤ ${title(M.escala[2])}`;
  return `<h3>${M.enfermedad} en ${M.cultivo.toLowerCase()} · <i style="font-weight:500">${M.agente}</i></h3>
    <p class="sub">${M.modelo} · ${M.var} · ${thr}</p>
    ${hasAny ? `<div class="chart" data-tips="${tipAttr(tips)}" data-w="${W}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Serie diaria del índice de ${M.enfermedad}">${g}</svg></div>`
      : `<div class="empty">Esta estación no tiene datos horarios en la API del SENAMHI (${esc(e.fuente)}${e.nota ? ', ' + esc(e.nota) : ''}). Aparecerá cuando su fuente se integre a la corrida.</div>`}`;
}

// ---- meteorología horaria
function tabClima(e) {
  const md = D.meteo[e.codigo];
  if (!md) return `<div class="empty">Sin serie meteorológica horaria para esta estación (${esc(e.fuente)}).</div>`;
  const N = md.T.length, W = 640, Lm = 36, Rm = 38, T = 22, H1 = 190, H2 = 70, gap = 18, B = 26, H = T + H1 + gap + H2 + B;
  const cw = (W - Lm - Rm) / N, x = i => Lm + (i + .5) * cw;
  const tv = md.T.filter(v => v != null), tmin = Math.floor(Math.min(...tv) / 5) * 5, tmax = Math.max(tmin + 5, Math.ceil(Math.max(...tv) / 5) * 5);
  const yT = v => T + H1 * (1 - (v - tmin) / (tmax - tmin)), yH = v => T + H1 * (1 - v / 100);
  const pmax = Math.max(2, ...md.PP.filter(v => v != null)), yP = v => T + H1 + gap + H2 * (1 - v / pmax);
  const f0 = md.src.indexOf('e');
  let g = '';
  if (f0 >= 0) g += `<rect x="${Lm + f0 * cw}" y="${T}" width="${W - Rm - Lm - f0 * cw}" height="${H1 + gap + H2}" fill="${tok('--fc')}"/><text x="${W - Rm}" y="${T - 8}" text-anchor="end">Pronóstico ETA 5 km (ajustado)</text>`;
  for (let t = tmin; t <= tmax; t += 5) g += `<line x1="${Lm}" x2="${W - Rm}" y1="${yT(t)}" y2="${yT(t)}" stroke="${tok('--line')}"/><text x="${Lm - 5}" y="${yT(t) + 3.5}" text-anchor="end" style="fill:${tok('--t')}">${t}°</text>`;
  [0, 50, 100].forEach(h => g += `<text x="${W - Rm + 5}" y="${yH(h) + 3.5}" style="fill:${tok('--hr')}">${h}%</text>`);
  g += `<line x1="${Lm}" x2="${W - Rm}" y1="${yP(0)}" y2="${yP(0)}" stroke="${tok('--line')}"/><text x="${Lm - 5}" y="${yP(pmax) + 8}" text-anchor="end" style="fill:${tok('--pp')}">${pmax.toFixed(0)}</text><text x="${Lm - 5}" y="${yP(0)}" text-anchor="end" style="fill:${tok('--pp')}">0</text><text x="${W - Rm + 5}" y="${yP(pmax / 2) + 3}" style="fill:${tok('--pp')}">mm</text>`;
  const t0 = new Date(md.t0.replace(' ', 'T'));
  const days = [];
  for (let i = 0; i < N; i++) { const d = new Date(t0.getTime() + i * 3600e3); if (d.getHours() === 0) days.push([i, d]); }
  days.forEach(([i, d]) => { g += `<line x1="${Lm + i * cw}" x2="${Lm + i * cw}" y1="${T}" y2="${T + H1 + gap + H2}" stroke="${tok('--line')}" stroke-dasharray="2 3"/><text x="${Lm + (i + 12) * cw}" y="${H - 8}" text-anchor="middle">${WD[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}</text>`; });
  const line = (arr, y) => { let s = '', on = false; arr.forEach((v, i) => { if (v == null || md.src[i] === 'x') { on = false; return; } s += (on ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); on = true; }); return s; };
  md.PP.forEach((v, i) => { if (v > 0) g += `<rect x="${x(i) - cw * .45}" y="${yP(v)}" width="${cw * .9}" height="${yP(0) - yP(v)}" fill="${tok('--pp')}"/>`; });
  g += `<path d="${line(md.HR, yH)}" fill="none" stroke="${tok('--hr')}" stroke-width="1.4"/>`;
  g += `<path d="${line(md.T, yT)}" fill="none" stroke="${tok('--t')}" stroke-width="1.6"/>`;
  const rows = days.map(([i, d], k) => {
    const j = k + 1 < days.length ? days[k + 1][0] : N, sl = a => a.slice(i, j).filter(v => v != null);
    const Ts = sl(md.T), Hs = sl(md.HR), Ps = sl(md.PP), src = md.src.slice(i, j);
    const fte = src.includes('o') && src.includes('e') ? 'Obs + Pron' : src.includes('e') ? 'Pronóstico' : 'Observado';
    return `<tr class="${src.includes('e') ? 'fc' : ''}"><td>${WD[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}</td>
      <td>${Math.min(...Ts).toFixed(1)}</td><td>${Math.max(...Ts).toFixed(1)}</td><td>${(Hs.reduce((a, b) => a + b, 0) / Hs.length).toFixed(0)}</td>
      <td>${Hs.filter(h => h >= 90).length}</td><td>${Ps.reduce((a, b) => a + b, 0).toFixed(1)}</td><td style="font-family:var(--f-body);color:var(--muted);text-align:left">${fte}${src.includes('x') ? ' · con huecos' : ''}</td></tr>`;
  }).join('');
  const tips = [];
  for (let i = 0; i < N; i++) { const d = new Date(t0.getTime() + i * 3600e3); tips.push({ x: x(i), w: cw, html: `<b>${WD[d.getDay()]} ${String(d.getDate()).padStart(2, '0')} · ${String(d.getHours()).padStart(2, '0')}:00</b><br>T <b>${md.T[i] ?? '—'}</b> °C · HR <b>${md.HR[i] ?? '—'}</b> % · PP <b>${md.PP[i] ?? '—'}</b> mm<br><span style="color:var(--muted)">${{ o: 'Observado', e: 'Pronóstico ETA', i: 'Interpolado', x: 'Hueco mayor a 6 h' }[md.src[i]]}</span>` }); }
  return `<h3>Condiciones meteorológicas horarias</h3>
    <p class="sub">${esc(e.nombre)} · 7 días observados y pronóstico. La temperatura y la humedad del ETA están ajustadas con el sesgo medio de la estación.</p>
    <div class="keys"><span><i style="background:${tok('--t')}"></i>Temperatura (°C)</span><span><i style="background:${tok('--hr')}"></i>Humedad relativa (%)</span><span><i style="background:${tok('--pp')};height:8px;width:8px"></i>Precipitación (mm/h)</span></div>
    <div class="chart" data-tips="${tipAttr(tips)}" data-w="${W}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperatura, humedad y precipitación horaria">${g}</svg></div>
    <div class="scroll" style="margin-top:14px"><table><thead><tr><th>Día</th><th>T mín</th><th>T máx</th><th>HR media</th><th>h HR≥90</th><th>PP mm</th><th style="text-align:left">Dato</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function tabRec(e) {
  const R = D.recomendaciones[M.id] || {}, n = e.niveles[dayIdx];
  return `<h3>Recomendaciones · ${M.enfermedad} en ${M.cultivo.toLowerCase()}</h3>
    <p class="sub">${esc(e.nombre)} · ${dayLbl(dayIdx)}</p>
    <div class="rec">${n === 'Sin datos' ? `<p>Sin datos para esta estación y día. Use la estación más cercana con datos o la evaluación de campo.</p>` :
      `<span class="lv${darkText(M, n) ? ' dark' : ''}" style="background:${colOf(M, n)}">${esc(title(n))}</span><p>${esc(R[n] || '')}</p>`}</div>
    <p style="margin:14px 0 0;max-width:65ch"><b>Manejo general.</b> ${esc(R.general || '')}</p>
    <div class="reclist">${M.escala.map(l => `<div class="${l === n ? 'cur' : ''}"><span><b style="color:${colOf(M, l)}">●</b> ${esc(title(l))}</span><p>${esc(R[l] || '')}</p></div>`).join('')}</div>
    <p class="draft">Texto en borrador para validación del especialista de la SPA. No reemplaza la evaluación de campo ni la recomendación del técnico del predio.</p>`;
}

function tabEst() {
  const f = M.fechas, i0 = Math.max(0, hoyIdx - 9), ix = [];
  for (let i = i0; i < f.length; i++) ix.push(i);
  const rows = [...M.estaciones].sort((a, b) => (sevOf(M, b.niveles[dayIdx]) ?? -1) - (sevOf(M, a.niveles[dayIdx]) ?? -1) || a.nombre.localeCompare(b.nombre));
  return `<h3>Todas las estaciones · ${M.enfermedad}</h3>
    <p class="sub">${rows.filter(e => e.niveles[dayIdx] !== 'Sin datos').length} de ${rows.length} estaciones con datos (${dayLbl(dayIdx)}). Ordenadas por el nivel de ese día; el borde punteado marca el pronóstico.</p>
    <div class="scroll"><table class="mx"><thead><tr><th></th>${ix.map(i => `<th class="${i === dayIdx ? 'h' : ''}">${f[i].slice(8)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(e => `<tr class="${keyOf(e) === selKey ? 'sel' : ''}"><td class="n" data-k="${esc(keyOf(e))}">${esc(e.nombre)}${e.fuente !== 'API SENAMHI' ? `<small>${esc(e.fuente)}</small>` : ''}</td>${ix.map(i => `<td><div class="c${i > hoyIdx ? ' fc' : ''}" title="${esc(e.nombre)} · ${fdm(f[i])} · ${esc(title(e.niveles[i]))}" style="background:${colOf(M, e.niveles[i])}"></div></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
}

function renderNotes() {
  $('#notes').innerHTML = `<h4>Cómo se calcula</h4><ul>
    <li>Datos horarios de las estaciones automáticas (API del SENAMHI) hasta las 14:00; desde ahí, el pronóstico horario del modelo ETA 5 km por ${M.fechas.length - hoyIdx - 1} días.</li>
    <li>La temperatura y la humedad del ETA se ajustan en cada estación con el desvío medio frente a lo observado en las horas comunes. Es un ajuste provisional.</li>
    <li>La unidad de la precipitación del ETA aún no está confirmada. Se usa como mm y por ahora casi no aporta lluvia al pronóstico.</li>
    <li>Sin datos: estación fuera de la API (red Polaris de la SPA, SISDAD o solo convencional diaria), día con huecos de más de 6 horas o estación sin transmitir en las últimas 48 horas.</li>
    <li>Los modelos se ejecutan tal como están en los scripts de la SPA, con las escalas de cada modelo.</li></ul>`;
}

function attachTip(box) {
  const tips = JSON.parse(box.dataset.tips || '[]'), W = +box.dataset.w; if (!tips.length) return;
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; box.appendChild(tip);
  const gd = document.createElement('div'); gd.className = 'guide'; gd.hidden = true; box.appendChild(gd);
  box.onmousemove = ev => {
    const r = box.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    const t = tips.find(t => Math.abs(t.x - sx) <= t.w / 2); if (!t) { tip.hidden = gd.hidden = true; return; }
    tip.innerHTML = t.html; tip.hidden = false;
    const px = t.x * r.width / W; gd.hidden = false; gd.style.left = px + 'px';
    tip.style.left = (px > r.width * .6 ? px - tip.offsetWidth - 12 : px + 12) + 'px';
    tip.style.top = Math.max(0, ev.clientY - r.top - tip.offsetHeight - 10) + 'px';
  };
  box.onmouseleave = () => { tip.hidden = gd.hidden = true; };
}

init().catch(err => { $('#station').innerHTML = `<div class="empty">No se pudieron cargar los datos del visor (${esc(err.message)}). Verifique que datos.json y departamentos.geojson estén junto a esta página.</div>`; });
</script>
